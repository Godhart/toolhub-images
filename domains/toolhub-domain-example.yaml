# Single source of truth; paths are resolved relative to this YAML, not your cwd.
domain:
  name: example
  uid: 1000
  gid: 1000
  host: 127.0.0.1
  port_base: 3300                 # router:3300, filesystem:3301, git:3302, docker:3303, hdl:3305
  path: ./example
  tools: tools                    # bare relative path -> domain root
  workspace: workspace            # ./... -> YAML directory; absolute paths supported
  admin_pass: replace-with-your-admin-password
  agent_pass: replace-with-your-agent-password
  seed_lang: ru
  network: true                   # default external access; false keeps only domain communication
  env: {}
  env_router: {}
  limits: {containers: 2, tmp: 512m, pids: 128, mem: 2g, cpu: 2.0}
options:
  abs_paths: true
  remove_unused_tools: true       # only previously generated git/local toolsets; never manual/untracked
  reset_settings: true            # on every service start; database backup is created first
bridge:
  enabled: true
  image: toolhub-mcp-bridge:base
  port: 100                       # offset: MCP HTTP at 3400/mcp

toolsets:
  - name: filesystem
    source_kind: git
    tools_kind: twylt
    data: {path: https://github.com/Godhart/twylt-pack-filesystem.git, ref: main, update: always}
  - name: git
    source_kind: git
    data: {path: https://github.com/Godhart/twylt-pack-git.git, ref: main, update: once}
  - name: docker
    source_kind: git
    data: {path: https://github.com/Godhart/twylt-pack-docker.git, ref: main, update: once}
  - name: hdl-order
    source_kind: git
    data: {path: https://github.com/Godhart/hdl-order.git, ref: main, update: once}
  # docsanity has no suitable pack in its repository yet; deferred to next iteration.

hubs:
  - name: filesystem
    image: toolhub-twylt:base
    port: 1                       # omit/null to keep worker private inside Compose
    kind: general
    network: false                # override the domain default for this worker
    env: {}
    limits: {tmp: 128m, pids: 128, mem: 1g, cpu: 1.0}
    packs:
      - toolset: filesystem
        prefix: filesystem
        exclude: []               # TWYLT names or relative file globs
        toolpak_builder_kwargs: {glob: '**/tool.py', timeout_ms: 120000}
    mcps: []                      # nonempty values are rejected in this iteration
  - name: git
    image: toolhub-twylt:git
    port: 2
    packs: [{toolset: git, prefix: git}]
  - name: docker
    image: toolhub-twylt:docker
    kind: docker
    port: 3
    docker_socket: /var/run/docker.sock
    # docker_socket_gid: 998       # optional: otherwise stat() the socket on generation host
    docker_workspace: host-readonly # same absolute host path, read-only; no /workspace mount
    packs: [{toolset: docker, prefix: exec}]
  - name: hdl
    image: toolhub-twylt:hdl
    port: 5
    packs: [{toolset: hdl-order, prefix: hdl}]
