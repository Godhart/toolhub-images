# Single source of truth; paths are resolved relative to this YAML, not your cwd.
domain:
  name: example
  uid: 1000
  gid: 1000
  host: 127.0.0.1
  port_base: 3300                 # router:3300, essential:3301, filesystem:3302, git:3303, docker:3304, hdl:3305
  path: ./example
  tools: tools                    # bare relative path -> domain root
  workspace: workspace            # ./... -> YAML directory; absolute paths supported
  admin_pass: replace-with-your-admin-password
  agent_pass: replace-with-your-agent-password
  seed_lang: ru
  network: false                   # default external access; false keeps only domain communication # NOTE: enable network when testing for web access, disable in production to prevent unattened network access
  env: {}                       # policy defaults supplied by generator
  env_router: {}
  limits: {containers: 2, tmp: 512m, pids: 128, mem: 2g, cpu: 2.0}
options:
  abs_paths: true
  remove_unused_tools: true       # only previously generated git/local toolsets; never manual/untracked
  reset_settings: true            # on every service start; database backup is created first
bridge:
  enabled: true
  image: toolhub-mcp-bridge:base
  port: 100                       # offset: MCP HTTP at 3400/mcp

toolsets:
  - name: essential
    source_kind: git
    tools_kind: twylt
    data: {path: https://github.com/Godhart/twylt-pack-essential.git, ref: 938da46801b931f1ee0a2c67fbeedcd82313a92c, update: always}
  - name: filesystem
    source_kind: git
    tools_kind: twylt
    data: {path: https://github.com/Godhart/twylt-pack-filesystem.git, ref: 371a0dce4ddfe374e369c628901ffc2e89cf1ffe, update: always}
  - name: git
    source_kind: git
    data: {path: https://github.com/Godhart/twylt-pack-git.git, ref: 490276761d48310632e1eb037c6273861406b5fb, update: always}
  - name: docker
    source_kind: git
    data: {path: https://github.com/Godhart/twylt-pack-docker.git, ref: 2027763bdca18b2b88877faf46fb7564b6e9de96, update: always}
  - name: hdl-order
    source_kind: git
    data: {path: https://github.com/Godhart/hdl-order.git, ref: 4ef8a1633f475fab0b608edaa1fbcf9cbc54f71c, update: always}
  # docsanity has no suitable pack in its repository yet; deferred to next iteration.

hubs:
  - name: essential
    network: true
    image: toolhub-twylt:essential
    port: 1
    # For web_search set env: {TWYLT_SEARXNG_URL: 'http://your-searxng:8080'}
    packs: [{toolset: essential, prefix: essential}]
  - name: filesystem
    image: toolhub-twylt:base
    port: 2                       # omit/null to keep worker private inside Compose
    kind: general
    network: false                # override the domain default for this worker
    env: {}
    limits: {tmp: 128m, pids: 128, mem: 1g, cpu: 1.0}
    packs:
      - toolset: filesystem
        prefix: filesystem
        exclude: []               # TWYLT names or relative file globs
        # toolpak_builder_kwargs: {glob: '**/tool.py', timeout_ms: 120000}
    mcps: []                      # nonempty values are rejected in this iteration
  - name: git
    network: true
    image: toolhub-twylt:git
    port: 3
    packs: [{toolset: git, prefix: git}]
  - name: docker
    image: toolhub-twylt:docker
    kind: docker
    port: 4
    docker_socket: /var/run/docker.sock
    # docker_socket_gid: 998       # optional: otherwise stat() the socket on generation host
    docker_workspace: host-readonly # same absolute host path, read-only; no /workspace mount
    packs: [{toolset: docker, prefix: exec}]
  - name: hdl
    image: toolhub-twylt:hdl
    port: 5
    packs: [{toolset: hdl-order, prefix: hdl}]
