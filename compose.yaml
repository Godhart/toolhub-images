services:
  toolhub:
    build:
      context: .
      target: base # git / docs / hdl
    image: toolhub-twylt:base
    init: false # tini is already in the image
    user: "1000:1000"
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    volumes:
      - ./data:/data
      - ./tools:/tools:ro
      - ./workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
